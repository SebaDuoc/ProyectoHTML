<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>
<!-- Enlace a Font Awesome para íconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-image: url('https://images.unsplash.com/photo-1531824475211-72594993ce2a?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
        background-size: cover;
        background-position: center;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .header {
        position: absolute;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background-color: rgba(0, 0, 0, 0.7);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
    }

    .header h1 {
        font-size: 28px;
        font-weight: bold;
        color: #fff;
        letter-spacing: 1.5px;
    }

    .icons {
        display: flex;
        gap: 20px;
        position: relative;
    }

    .icon {
        font-size: 28px;
        cursor: pointer;
        color: #fff;
        transition: color 0.3s, transform 0.2s;
    }

    .icon:hover {
        color: #4a90e2;
        transform: scale(1.1);
    }

    /* Estilos del menú desplegable */
    .dropdown-menu {
        display: none;
        position: absolute;
        top: 40px;
        right: 0;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        width: 200px;
        z-index: 100;
    }

    .dropdown-menu a {
        display: block;
        padding: 10px;
        text-decoration: none;
        color: #333;
        transition: background-color 0.3s;
    }

    .dropdown-menu a:hover {
        background-color: #4a90e2;
        color: #fff;
    }

    /* Mostrar el menú cuando el ícono está activo */
    .dropdown-menu.show {
        display: block;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, auto);
        gap: 40px;
        justify-items: center;
        align-items: center;
        width: 100%;
        max-width: 900px;
    }

    .button {
        width: 250px; /* Ancho fijo */
        height: 200px; /* Alto fijo */
        background: rgba(255, 255, 255, 0.9);
        border-radius: 15px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        text-decoration: none;
        transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
        cursor: pointer;
    }

    .button:hover {
        transform: translateY(-8px);
        background: #4a90e2;
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
    }

    .button .icon {
        color: #007bff;
        font-size: 60px;
        margin-bottom: 20px;
        transition: color 0.3s;
    }

    .button:hover .icon {
        color: #fff;
    }

    .button p {
        margin: 0;
        font-size: 20px;
        color: #333;
        font-weight: bold;
        transition: color 0.3s;
    }

    .button:hover p {
        color: #fff;
    }

    /* Posición del botón central */
    .center {
        grid-column: 2;
        grid-row: 2;
    }
</style>
</head>
<body>
    <div class="header">
        <h1>Luschinger Ferretería</h1>
        <div class="icons">
            <!-- Ícono de usuario con lista desplegable -->
            <div class="user-container" onclick="toggleDropdown('userMenu')">
                <i class="fa-solid fa-user icon"></i>
                <div id="userMenu" class="dropdown-menu">
                    <a href="perfil.html">Perfil</a>
                    <a href="logout.html">Cerrar sesión</a>
                </div>
            </div>

            <!-- Ícono de configuración con lista desplegable -->
            <div class="settings-container" onclick="toggleDropdown('settingsMenu')">
                <i class="fa-solid fa-gear icon"></i>
                <div id="settingsMenu" class="dropdown-menu">
                    <a href="configuracion.html">Configuración</a>

                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <a href="agregar_productos.html" class="button" style="grid-column: 1; grid-row: 1;">
            <i class="fa-solid fa-plus icon"></i>
            <p>Agregar productos</p>
        </a>
        <a href="modificar_productos.html" class="button" style="grid-column: 3; grid-row: 1;">
            <i class="fa-solid fa-pen-to-square icon"></i>
            <p>Modificar productos</p>
        </a>
        <a href="informe.xlsx" class="button center">
            <i class="fa-solid fa-file-excel icon"></i>
            <p>Generar informe</p>
        </a>
        <a href="consultar_stock.html" class="button" style="grid-column: 1; grid-row: 3;">
            <i class="fa-solid fa-box-open icon"></i>
            <p>Consultar stock</p>
        </a>
        <a href="ajustar_precios.html" class="button" style="grid-column: 3; grid-row: 3;">
            <i class="fa-solid fa-dollar-sign icon"></i>
            <p>Ajustar precios</p>
        </a>
    </div>

    <script>
        // Función para mostrar u ocultar los menús desplegables
        function toggleDropdown(menuId) {
            const menu = document.getElementById(menuId);
            menu.classList.toggle('show');
        }

        // Cerrar los menús si se hace clic fuera de ellos
        window.onclick = function(event) {
            const userMenu = document.getElementById("userMenu");
            const settingsMenu = document.getElementById("settingsMenu");

            if (!event.target.matches('.user-container, .user-container *') && userMenu.classList.contains('show')) {
                userMenu.classList.remove('show');
            }

            if (!event.target.matches('.settings-container, .settings-container *') && settingsMenu.classList.contains('show')) {
                settingsMenu.classList.remove('show');
            }
        }
    </script>
</body>
</html>
