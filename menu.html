<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Inventario Ferretería</title>
<!-- Enlace a Font Awesome para íconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: url('https://images.unsplash.com/photo-1531824475211-72594993ce2a?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 20px;
        color: #fff;
        overflow: hidden;
    }

    .header {
        position: absolute;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background-color: rgba(0, 0, 0, 0.7);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
    }

    .header h1 {
        font-size: 28px;
        font-weight: bold;
        color: #fff;
        letter-spacing: 1.5px;
    }

    .icons {
        display: flex;
        gap: 20px;
        position: relative;
    }

    .icon {
        font-size: 28px;
        cursor: pointer;
        color: #fff;
        transition: color 0.3s, transform 0.2s;
    }

    .icon:hover {
        color: #4a90e2;
        transform: scale(1.1);
    }

    .user-container {
        position: relative;
    }

    .dropdown-menu {
        display: none;
        position: absolute;
        top: 110%;
        right: 0;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        width: 150px;
        overflow: hidden;
    }

    .dropdown-menu a {
        display: block;
        padding: 10px;
        color: #333;
        font-size: 14px;
        text-decoration: none;
        transition: background-color 0.2s;
    }

    .dropdown-menu a:hover {
        background-color: #4a90e2;
        color: #fff;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 40px;
        width: 100%;
        max-width: 900px;
        padding-top: 80px;
    }

    .button {
        background-color: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.3s, background-color 0.3s, box-shadow 0.3s;
        text-decoration: none;
    }

    .button:hover {
        transform: translateY(-8px);
        background-color: #4a90e2;
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
    }

    .button .icon {
        color: #007bff;
        font-size: 60px;
        margin-bottom: 20px;
        transition: color 0.3s;
    }

    .button:hover .icon {
        color: #fff;
    }

    .button p {
        margin: 0;
        font-size: 20px;
        color: #333;
        text-align: center;
        font-weight: bold;
        transition: color 0.3s;
    }

    .button:hover p {
        color: #fff;
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const userIcon = document.querySelector(".user-container .fa-user");
        const dropdownMenu = document.querySelector(".user-container .dropdown-menu");

        userIcon.addEventListener("click", function () {
            dropdownMenu.style.display = dropdownMenu.style.display === "block" ? "none" : "block";
        });

        document.addEventListener("click", function (e) {
            if (!userIcon.contains(e.target) && !dropdownMenu.contains(e.target)) {
                dropdownMenu.style.display = "none";
            }
        });
    });
</script>
</head>
<body>

    <div class="header">
        <h1>Luschinger Ferretería</h1>
        <div class="icons">
            <div class="user-container">
                <i class="fa-solid fa-user icon"></i>
                <div class="dropdown-menu">
                    <a href="perfil.html">Ver Perfil</a>
                    <a href="logout.html">Cerrar Sesión</a>
                </div>
            </div>
            <i class="fa-solid fa-gear icon"></i>
        </div>
    </div>
    
    <div class="container">
        <a href="agregar_productos.html" class="button">
            <i class="fa-solid fa-plus icon"></i>
            <p>Agregar productos</p>
        </a>
    
        <a href="modificar_productos.html" class="button">
            <i class="fa-solid fa-pen-to-square icon"></i>
            <p>Modificar productos</p>
        </a>
    
        <a href="consultar_stock.html" class="button">
            <i class="fa-solid fa-box-open icon"></i>
            <p>Consultar stock</p>
        </a>
    
        <a href="ajustar_precios.html" class="button">
            <i class="fa-solid fa-dollar-sign icon"></i>
            <p>Ajustar precios</p>
        </a>
    </div>

</body>
</html>
