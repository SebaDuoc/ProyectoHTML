<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <style>
        /* Estilos básicos */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .profile-container {
            background-color: #fff;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .profile-container h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 20px;
        }

        .profile-info h2 {
            color: #007bff;
            margin: 10px 0;
            font-size: 24px;
        }

        .profile-info p {
            color: #555;
            margin: 5px 0;
            font-size: 16px;
        }

        .profile-actions {
            margin-top: 20px;
        }

        .profile-actions button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .profile-actions button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>Perfil de Usuario</h1>
        
        <!-- Imagen de perfil -->
        <img src="foto.jpg" alt="Foto de perfil" class="profile-image">
        
        <!-- Información del usuario -->
        <div class="profile-info">
            <h2>Shrek Sanchez</h2>
            <p><strong>Email:</strong> Shrek@correo.cl</p>
            <p><strong>Teléfono:</strong> +569133</p>
            <p><strong>Dirección:</strong> Calle real, Muy Muy Lejano, Chile</p>
        </div>

        <!-- Opciones -->
        <div class="profile-actions">
            <button onclick="window.location.href='editar_perfil.html'">Editar Perfil</button>
            <button onclick="window.location.href='menu.html'">Volver al Menú</button>
        </div>
    </div>

</body>
</html>
