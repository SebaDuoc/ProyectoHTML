<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <style>
        /* Reinicio de estilos básicos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Estilos del cuerpo */
        body {
            font-family: Arial, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1531824475211-72594993ce2a?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        /* Contenedor principal del perfil */
        .profile-container {
            background-color: #fff;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-container h1 {
            color: #4a90e2;
            font-size: 28px;
            margin-bottom: 20px;
            border-bottom: 2px solid #4a90e2;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Estilos de la imagen de perfil */
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #4a90e2;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .profile-image:hover {
            transform: scale(1.05);
        }

        /* Información del usuario */
        .profile-info h2 {
            color: #333;
            font-size: 24px;
            margin: 10px 0;
        }

        .profile-info p {
            color: #666;
            font-size: 16px;
            margin: 5px 0;
            line-height: 1.6;
        }

        /* Estilos de las acciones */
        .profile-actions {
            margin-top: 20px;
        }

        .profile-actions button {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0px 5px 15px rgba(74, 144, 226, 0.3);
        }

        .profile-actions button:hover {
            background-color: #3b7bc4;
            transform: translateY(-2px);
            box-shadow: 0px 8px 20px rgba(74, 144, 226, 0.4);
        }

        /* Efecto para sombreado en botones activos */
        .profile-actions button:active {
            transform: translateY(0);
            box-shadow: 0px 4px 10px rgba(74, 144, 226, 0.2);
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>Perfil de Usuario</h1>
        
        <!-- Imagen de perfil -->
        <img src="foto.jpg" alt="Foto de perfil" class="profile-image">
        
        <!-- Información del usuario -->
        <div class="profile-info">
            <h2>pepito Sanchez</h2>
            <p><strong>Email:</strong> pepito@correo.cl</p>
            <p><strong>Teléfono:</strong> +569133</p>
            <p><strong>Dirección:</strong> Calle real, Chile</p>
        </div>

        <!-- Opciones -->
        <div class="profile-actions">
            <button onclick="window.location.href='editar_perfil.html'">Editar Perfil</button>
            <button onclick="window.location.href='menu.html'">Volver al Menú</button>
        </div>
    </div>

</body>
</html>
