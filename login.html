<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Estilos originales */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .login-container {
            width: 500px;
            padding: 50px;
            background-color: #fff;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            border-radius: 12px;
        }

        .login-container h1 {
            margin: 0;
            font-size: 32px;
            font-weight: bold;
        }

        .login-container p {
            font-size: 20px;
            color: #333;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        .login-container .user-icon {
            width: 90px;
            height: 90px;
            background-color: #ddd;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: #666;
            margin: 25px 0;
        }

        .input-container {
            position: relative;
            margin-bottom: 20px;
        }

        .input-container i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #666;
            font-size: 20px;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 15px 55px 15px 50px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box;
        }

        .login-container a {
            display: block;
            margin-top: 15px;
            font-size: 16px;
            color: #0066cc;
            text-decoration: none;
        }

        .login-container a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background-color: #0066cc;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-btn i {
            margin-left: 10px;
        }

        .login-btn:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Luschinger</h1>
        <p>Ferretería</p>
        <div class="user-icon">
            <i class="fas fa-user-circle"></i>
        </div>
        
        <form id="loginForm" onsubmit="return loginUser()">
            <div class="input-container">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="Usuario" required>
            </div>
            <div class="input-container">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>
            <a href="contrasena.html">¿Olvidaste tu contraseña?</a>
            <button type="submit" class="login-btn">Iniciar sesión <i class="fas fa-arrow-right"></i></button>
        </form>
    </div>

    <script>
        // Función para validar y redirigir al menú principal
        function loginUser() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Comprobación de campos vacíos
            if (!username || !password) {
                alert("Por favor, completa todos los campos.");
                return false;
            }

            // Verificar que la contraseña tenga al menos 8 caracteres, una letra y un número
            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
            if (!passwordRegex.test(password)) {
                alert("La contraseña debe tener al menos 8 caracteres, incluyendo una letra y un número.");
                return false;
            }

            // Redirigir al menú principal
            window.location.href = "menu.html";
            return false; // Previene el envío del formulario
        }
    </script>
</body>
</html>
