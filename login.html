<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Estilos mejorados */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://images.unsplash.com/photo-1531824475211-72594993ce2a?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            color: #333;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background-color: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            border-radius: 12px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container h1 {
            margin: 0;
            font-size: 2em;
            font-weight: bold;
            color: #004e92;
        }

        .login-container p {
            font-size: 1.2em;
            color: #666;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        .user-icon {
            width: 90px;
            height: 90px;
            background-color: #f0f2f5;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: #004e92;
            margin: 20px 0;
        }

        .input-container {
            position: relative;
            margin-bottom: 20px;
        }

        .input-container i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 12px 50px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .login-container input[type="text"]:focus,
        .login-container input[type="password"]:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.2);
        }

        .login-container a {
            display: block;
            margin-top: 15px;
            font-size: 0.9em;
            color: #004e92;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .login-container a:hover {
            color: #006bb3;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: linear-gradient(135deg, #4a90e2, #004e92);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, transform 0.2s;
        }

        .login-btn i {
            margin-left: 8px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #3a7fc5, #003d7d);
            transform: translateY(-2px);
        }

        /* Centrar reCAPTCHA */
        .g-recaptcha {
            margin: 20px auto;
            display: inline-block;
        }

        /* Estilos del selector de idioma */
        select {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 id="title">Luschinger</h1>
        <p id="subtitle">Ferretería</p>
        <div class="user-icon">
            <i class="fas fa-user-circle"></i>
        </div>
        
        <form id="loginForm" onsubmit="return loginUser()">
            <div class="input-container">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="Usuario" required>
            </div>
            <div class="input-container">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>

            <div>
                <input type="checkbox" id="remember" name="remember">
                <label id="remember-label" for="remember">Recordarme</label>
            </div>

            <a id="forgot-password" href="contrasena.html">¿Olvidaste tu contraseña?</a>
            <div class="g-recaptcha" data-sitekey="tu_clave_site_key"></div>
            <button type="submit" class="login-btn" id="login-btn">Iniciar sesión <i class="fas fa-arrow-right"></i></button>
        </form>

        <div>
            <select id="language-selector" onchange="changeLanguage()">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>

        <p id="no-account">¿No tienes una cuenta? <a id="register-link" href="registro.html">Regístrate aquí</a></p>
    </div>

    <script src="https://www.google.com/recaptcha/api.js"></script>
    <script>
        // Objeto de traducciones
        const translations = {
            es: {
                title: "Luschinger",
                subtitle: "Ferretería",
                usernamePlaceholder: "Usuario",
                passwordPlaceholder: "Contraseña",
                remember: "Recordarme",
                forgotPassword: "¿Olvidaste tu contraseña?",
                loginButton: "Iniciar sesión",
                noAccount: "¿No tienes una cuenta?",
                registerLink: "Regístrate aquí",
            },
            en: {
                title: "Luschinger",
                subtitle: "Hardware Store",
                usernamePlaceholder: "Username",
                passwordPlaceholder: "Password",
                remember: "Remember me",
                forgotPassword: "Forgot your password?",
                loginButton: "Log in",
                noAccount: "Don't have an account?",
                registerLink: "Register here",
            }
        };

        function changeLanguage() {
            const lang = document.getElementById("language-selector").value;
            const t = translations[lang];
            
            document.getElementById("title").textContent = t.title;
            document.getElementById("subtitle").textContent = t.subtitle;
            document.getElementById("username").placeholder = t.usernamePlaceholder;
            document.getElementById("password").placeholder = t.passwordPlaceholder;
            document.getElementById("remember-label").textContent = t.remember;
            document.getElementById("forgot-password").textContent = t.forgotPassword;
            document.getElementById("login-btn").textContent = t.loginButton;
            document.getElementById("no-account").innerHTML = `${t.noAccount} <a id="register-link" href="registro.html">${t.registerLink}</a>`;
        }

        function loginUser() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (!username || !password) {
                alert("Por favor, completa todos los campos.");
                return false;
            }

            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
            if (!passwordRegex.test(password)) {
                alert("La contraseña debe tener al menos 8 caracteres, incluyendo una letra y un número.");
                return false;
            }

            window.location.href = "menu.html";
            return false;
        }
    </script>
</body>
</html>
