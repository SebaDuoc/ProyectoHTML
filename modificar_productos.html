<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Producto</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* Aquí se encuentra tu estilo CSS original */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1531824475211-72594993ce2a?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            color: #fff;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.8);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }

        .input-group input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        .autocomplete-list {
            position: absolute;
            background-color: white;
            border: 1px solid #ddd;
            max-height: 150px;
            overflow-y: auto;
            z-index: 1000;
            width: calc(100% - 40px); /* Ajuste según el padding */
        }

        .autocomplete-list div {
            padding: 10px;
            cursor: pointer;
            font-size: 1em; /* Asegura un tamaño legible */
            color: #333; /* Color del texto (oscuro) */
            background-color: #fff; /* Fondo blanco */
            border-bottom: 1px solid #ddd; /* Añade un separador */
        }

        .autocomplete-list div:hover {
            background-color: #f0f0f0; /* Fondo al pasar el mouse */
            color: #000; /* Texto visible en hover */
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .button {
            padding: 14px 30px;
            font-size: 1.2em;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
            width: 48%;
        }

        .button:hover {
            transform: translateY(-5px);
        }

        .button-red {
            background-color: #e74c3c;
        }

        .button-red:hover {
            background-color: #c0392b;
        }

        .button-green {
            background-color: #2ecc71;
        }

        .button-green:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Modificar Producto</h2>
        <form action="#">
            <div class="input-group" style="position: relative;">
                <label for="productId">Producto</label>
                <input type="text" id="productId" name="productId" placeholder="Ingrese el producto" required autocomplete="off">
                <div id="autocomplete-list" class="autocomplete-list"></div>
            </div>

            <div class="input-group">
                <label for="productCategory">Categoría</label>
                <input type="text" id="productCategory" name="productCategory" placeholder="Ingrese la Categoría" required>
            </div>

            <div class="input-group">
                <label for="stockAmount">Cantidad en Stock</label>
                <input type="number" id="stockAmount" name="stockAmount" placeholder="Ingrese la cantidad de stock" required>
            </div>

            <div class="input-group">
                <label for="unitPrice">Precio Unitario</label>
                <input type="number" id="unitPrice" name="unitPrice" placeholder="Ingrese el precio Unitario" required>
            </div>

            <div class="button-container">
                <button type="button" class="button button-red" onclick="window.location.href='menu.html';">Volver</button>
                <button type="submit" class="button button-green">Guardar Cambios</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const productIdField = document.getElementById("productId");
            const autocompleteList = document.getElementById("autocomplete-list");
            const productCategoryField = document.getElementById("productCategory");
            const stockAmountField = document.getElementById("stockAmount");
            const unitPriceField = document.getElementById("unitPrice");

            let excelData = [];

            // Función para cargar el archivo Excel
            function loadExcel(file) {
                fetch(file)
                    .then(response => response.arrayBuffer())
                    .then(data => {
                        const workbook = XLSX.read(data, { type: "array" });
                        const sheetName = workbook.SheetNames[0];
                        const sheet = workbook.Sheets[sheetName];
                        excelData = XLSX.utils.sheet_to_json(sheet);
                    })
                    .catch(error => console.error("Error al cargar el archivo Excel:", error));
            }

            // Habilitar búsqueda con autocompletado
            productIdField.addEventListener("input", () => {
                const query = productIdField.value.toLowerCase().trim();
                autocompleteList.innerHTML = "";
                if (query) {
                    const matches = excelData.filter(item =>
                        item.Producto?.toLowerCase().includes(query)
                    );
                    matches.forEach(match => {
                        const div = document.createElement("div");
                        div.textContent = match.Producto;
                        div.addEventListener("click", () => {
                            productIdField.value = match.Producto;
                            productCategoryField.value = match.Categoría || "";
                            stockAmountField.value = match["Cantidad en Stock"] || "";
                            unitPriceField.value = match["Precio Unitario"] || "";
                            autocompleteList.innerHTML = "";
                        });
                        autocompleteList.appendChild(div);
                    });
                }
            });

            // Llamar a la función para cargar el archivo Excel (debe estar en la misma carpeta)
            loadExcel("informe.xlsx");
        });
    </script>

</body>
</html>
