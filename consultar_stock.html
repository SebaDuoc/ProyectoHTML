<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar Stock - Ferretería</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        width: 100%;
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-top: 20px;
    }

    .back-button {
        display: inline-block;
        padding: 10px 20px;
        font-size: 16px;
        color: #fff;
        background-color: #6c757d;
        text-decoration: none;
        border-radius: 5px;
        margin-bottom: 20px;
        text-align: center;
    }

    .back-button:hover {
        background-color: #5a6268;
    }

    h1 {
        text-align: center;
        color: #007bff;
        margin-bottom: 20px;
    }

    .search-bar {
        display: flex;
        margin-bottom: 20px;
    }

    .search-bar input[type="text"] {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px 0 0 5px;
        outline: none;
    }

    .search-bar button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
        border-radius: 0 5px 5px 0;
    }

    .search-bar button:hover {
        background-color: #0056b3;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    table, th, td {
        border: 1px solid #ddd;
    }

    th, td {
        padding: 12px;
        text-align: center;
    }

    th {
        background-color: #007bff;
        color: #fff;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    /* Estilos del modal */
    .modal {
        display: none; /* Oculto por defecto */
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
    }

    .modal-content {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        max-width: 400px;
        width: 90%;
        text-align: center;
    }

    .modal-content h2 {
        color: #ff0000;
        margin-bottom: 10px;
    }

    .modal-content ul {
        list-style: none;
        padding: 0;
    }

    .modal-content li {
        margin: 5px 0;
        color: #333;
    }

    .modal-content button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .modal-content button:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>

<div class="container">
    <!-- Botón de volver -->
    <a href="menu.html" class="back-button">Volver</a>

    <h1>Consultar Stock</h1>

    <!-- Barra de búsqueda -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar por nombre de producto...">
        <button onclick="searchStock()">Buscar</button>
    </div>

    <!-- Tabla de resultados -->
    <table id="stockTable">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Cantidad en Stock</th>
                <th>Precio Unitario</th>
            </tr>
        </thead>
        <tbody>
            <!-- Filas de ejemplo -->
            <tr>
                <td>Martillo</td>
                <td>Herramientas</td>
                <td>50</td>
                <td>$20</td>
            </tr>
            <tr>
                <td>Clavos</td>
                <td>Ferretería</td>
                <td>5</td>
                <td>$5</td>
            </tr>
            <tr>
                <td>Destornillador</td>
                <td>Herramientas</td>
                <td>5</td>
                <td>$15</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal para alerta de bajo stock -->
<div id="lowStockModal" class="modal">
    <div class="modal-content">
        <h2>Advertencia</h2>
        <p>Queda poco stock de los siguientes productos:</p>
        <ul id="lowStockList"></ul>
        <button onclick="closeModal()">Cerrar</button>
    </div>
</div>

<script>
    // Función de búsqueda
    function searchStock() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const rows = document.querySelectorAll("#stockTable tbody tr");
        
        rows.forEach(row => {
            const product = row.cells[0].textContent.toLowerCase();
            if (product.includes(input)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
        });
    }

    // Función para verificar y mostrar alerta de bajo stock
    function checkLowStock() {
        const rows = document.querySelectorAll("#stockTable tbody tr");
        let lowStockFound = false;
        const lowStockList = document.getElementById("lowStockList");
        lowStockList.innerHTML = ""; // Limpiar lista del modal

        rows.forEach(row => {
            const stock = parseInt(row.cells[2].textContent, 10);
            const productName = row.cells[0].textContent;
            
            if (stock < 10) {
                row.classList.add("low-stock"); // Agrega clase para resaltar fila
                lowStockFound = true;
                
                // Agregar producto a la lista en el modal
                const listItem = document.createElement("li");
                listItem.textContent = productName;
                lowStockList.appendChild(listItem);
            }
        });
        
        // Si se encuentra bajo stock, mostrar el modal
        if (lowStockFound) {
            document.getElementById("lowStockModal").style.display = "flex";
        }
    }

    // Función para cerrar el modal
    function closeModal() {
        document.getElementById("lowStockModal").style.display = "none";
    }

    // Llamar a la función de bajo stock al cargar la página
    window.onload = checkLowStock;
</script>

</body>
</html>
