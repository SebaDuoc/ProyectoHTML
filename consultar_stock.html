<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar Stock - Informe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        background-image: url('https://images.unsplash.com/photo-1531824475211-72594993ce2a?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        width: 100%;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        margin-top: 20px;
        text-align: center;
        animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .back-button {
        display: inline-block;
        padding: 10px;
        font-size: 24px;
        color: #fff;
        background-color: #e74c3c;
        text-decoration: none;
        border-radius: 50%;
        margin-bottom: 20px;
        text-align: center;
        transition: background 0.3s ease, transform 0.2s;
        width: 50px;
        height: 50px;
        line-height: 50px;
        position: absolute;
        top: 20px;
        left: 20px;
    }

    .back-button:hover {
        background-color: #e74c3c;
        transform: scale(1.05);
    }

    .back-button::before {
        content: "←";
    }

    h1 {
        font-size: 2em;
        color: #007bff;
        margin-bottom: 20px;
    }

    .search-bar {
        display: flex;
        margin-bottom: 20px;
    }

    .search-bar input[type="text"] {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px 0 0 5px;
        outline: none;
        transition: box-shadow 0.3s ease;
    }

    .search-bar input[type="text"]:focus {
        box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
    }

    .search-bar button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
        border-radius: 0 5px 5px 0;
        transition: background-color 0.3s ease, transform 0.2s;
    }

    .search-bar button:hover {
        background-color: #0056b3;
        transform: scale(1.05);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        text-align: left;
    }

    table, th, td {
        border: 1px solid #ddd;
    }

    th, td {
        padding: 12px;
    }

    th {
        background-color: #007bff;
        color: #fff;
        font-weight: bold;
        text-align: center;
    }

    td {
        text-align: center;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    tr.low-stock {
        background-color: #ffe5e5;
        color: #d9534f;
    }

    tr:hover {
        background-color: #f1f1f1;
    }
</style>
</head>
<body>

<a href="menu.html" class="back-button"></a>

<div class="container">
    <h1>Consultar Stock</h1>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar por nombre de producto...">
        <button onclick="searchStock()">Buscar</button>
    </div>

    <table id="stockTable">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Cantidad en Stock</th>
                <th>Precio Unitario</th>
            </tr>
        </thead>
        <tbody>
            <!-- Datos generados dinámicamente -->
        </tbody>
    </table>
</div>

<script>
    let stockData = []; // Aquí se almacenarán los datos del Excel

    // Cargar automáticamente el archivo Excel
    function loadExcelFromFile() {
        fetch('informe.xlsx') // Cambia 'informe.xlsx' por la ruta de tu archivo
            .then(response => response.arrayBuffer())
            .then(data => {
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0]; // Primera hoja
                const sheet = workbook.Sheets[sheetName];
                stockData = XLSX.utils.sheet_to_json(sheet); // Convertir a JSON
                console.log(stockData); // Mostrar los datos leídos
                populateTable(stockData);
                checkForLowStockAlert(stockData); // Verificar alerta de bajo stock
            })
            .catch(error => {
                console.error("Error al cargar el archivo Excel:", error);
            });
    }

    // Llenar la tabla con los datos del Excel
    function populateTable(data) {
        const tbody = document.querySelector("#stockTable tbody");
        tbody.innerHTML = ""; // Limpiar tabla existente

        data.forEach(item => {
            const cantidadStock = isNaN(parseInt(item["Cantidad en Stock"])) ? 0 : parseInt(item["Cantidad en Stock"]);
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${item["Producto"] || "N/A"}</td>
                <td>${item["Categoría"] || "N/A"}</td>
                <td>${cantidadStock}</td>
                <td>${item["Precio Unitario"] || "N/A"}</td>
            `;
            tbody.appendChild(row);
        });

        checkLowStock(); // Verificar bajo stock
    }

    // Filtrar los datos al buscar
    function searchStock() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const filteredData = stockData.filter(item =>
            item["Producto"].toLowerCase().includes(input)
        );
        populateTable(filteredData);
    }

    // Verificar productos con bajo stock
    function checkLowStock() {
        const rows = document.querySelectorAll("#stockTable tbody tr");
        rows.forEach(row => {
            const stock = parseInt(row.cells[2].textContent, 10);
            if (!isNaN(stock) && stock < 10) {
                row.classList.add("low-stock");
            }
        });
    }

    // Mostrar alerta si hay productos con bajo stock
    function checkForLowStockAlert(data) {
        const lowStockItems = data.filter(item => parseInt(item["Cantidad en Stock"]) < 10);
        if (lowStockItems.length > 0) {
            alert(`¡Atención! Hay ${lowStockItems.length} productos con bajo stock.`);
        }
    }

    // Cargar el Excel al cargar la página
    document.addEventListener("DOMContentLoaded", loadExcelFromFile);
</script>

</body>
</html>
