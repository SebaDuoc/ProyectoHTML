<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar Stock - Ferretería</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    /* Estilos generales */
    body {
        font-family: Arial, sans-serif;
        background-image: url('https://images.unsplash.com/photo-1531824475211-72594993ce2a?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        width: 100%;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        margin-top: 20px;
        text-align: center;
        animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Botón de volver */
    .back-button {
        display: inline-block;
        padding: 10px 20px;
        font-size: 16px;
        color: #fff;
        background-color: #6c757d;
        text-decoration: none;
        border-radius: 5px;
        margin-bottom: 20px;
        text-align: center;
        transition: background 0.3s ease, transform 0.2s;
    }

    .back-button:hover {
        background-color: #5a6268;
        transform: scale(1.05);
    }

    h1 {
        font-size: 2em;
        color: #007bff;
        margin-bottom: 20px;
    }

    /* Barra de búsqueda */
    .search-bar {
        display: flex;
        margin-bottom: 20px;
    }

    .search-bar input[type="text"] {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px 0 0 5px;
        outline: none;
        transition: box-shadow 0.3s ease;
    }

    .search-bar input[type="text"]:focus {
        box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
    }

    .search-bar button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
        border-radius: 0 5px 5px 0;
        transition: background-color 0.3s ease, transform 0.2s;
    }

    .search-bar button:hover {
        background-color: #0056b3;
        transform: scale(1.05);
    }

    /* Tabla de resultados */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        text-align: left;
    }

    table, th, td {
        border: 1px solid #ddd;
    }

    th, td {
        padding: 12px;
    }

    th {
        background-color: #007bff;
        color: #fff;
        font-weight: bold;
        text-align: center;
    }

    td {
        text-align: center;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    tr.low-stock {
        background-color: #ffe5e5;
        color: #d9534f;
    }

    /* Efecto de hover en filas de la tabla */
    tr:hover {
        background-color: #f1f1f1;
    }

    /* Estilos del modal */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
    }

    .modal-content {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        max-width: 400px;
        width: 90%;
        text-align: center;
    }

    .modal-content h2 {
        color: #ff0000;
        margin-bottom: 10px;
    }

    .modal-content ul {
        list-style: none;
        padding: 0;
        color: #333;
    }

    .modal-content li {
        margin: 5px 0;
    }

    .modal-content button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #007bff;
        color: #ffffff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .modal-content button:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>

<div class="container">
    <!-- Botón de volver -->
    <a href="menu.html" class="back-button">Volver</a>

    <h1>Consultar Stock</h1>

    <!-- Barra de búsqueda -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar por nombre de producto...">
        <button onclick="searchStock()">Buscar</button>
    </div>

    <!-- Tabla de resultados -->
    <table id="stockTable">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Cantidad en Stock</th>
                <th>Precio Unitario</th>
            </tr>
        </thead>
        <tbody>
            <!-- Filas de ejemplo -->
            <tr>
                <td>Martillo</td>
                <td>Herramientas</td>
                <td>50</td>
                <td>$20</td>
            </tr>
            <tr>
                <td>Clavos</td>
                <td>Ferretería</td>
                <td>5</td>
                <td>$5</td>
            </tr>
            <tr>
                <td>Destornillador</td>
                <td>Herramientas</td>
                <td>5</td>
                <td>$15</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal para alerta de bajo stock -->
<div id="lowStockModal" class="modal">
    <div class="modal-content">
        <h2>Advertencia</h2>
        <p>Queda poco stock de los siguientes productos:</p>
        <ul id="lowStockList"></ul>
        <button onclick="closeModal()">Cerrar</button>
    </div>
</div>

<script>
    // Función de búsqueda
    function searchStock() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const rows = document.querySelectorAll("#stockTable tbody tr");
        
        rows.forEach(row => {
            const product = row.cells[0].textContent.toLowerCase();
            row.style.display = product.includes(input) ? "" : "none";
        });
    }

    // Función para verificar y mostrar alerta de bajo stock
    function checkLowStock() {
        const rows = document.querySelectorAll("#stockTable tbody tr");
        let lowStockFound = false;
        const lowStockList = document.getElementById("lowStockList");
        lowStockList.innerHTML = ""; // Limpiar lista del modal

        rows.forEach(row => {
            const stock = parseInt(row.cells[2].textContent, 10);
            const productName = row.cells[0].textContent;
            
            if (stock < 10) {
                row.classList.add("low-stock"); // Agrega clase para resaltar fila
                lowStockFound = true;
                
                // Agregar producto a la lista en el modal
                const listItem = document.createElement("li");
                listItem.textContent = productName;
                lowStockList.appendChild(listItem);
            }
        });
        
        // Si se encuentra bajo stock, mostrar el modal
        if (lowStockFound) {
            document.getElementById("lowStockModal").style.display = "flex";
        }
    }

    // Función para cerrar el modal
    function closeModal() {
        document.getElementById("lowStockModal").style.display = "none";
    }

    // Llamar a la función de bajo stock al cargar la página
    window.onload = checkLowStock;
</script>

</body>
</html>
