<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agregar Productos</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-image: url('https://images.unsplash.com/photo-1531824475211-72594993ce2a?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: #333;
    }

    .container {
        background: rgba(255, 255, 255, 0.9);
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        width: 450px;
        max-width: 90%;
        text-align: center;
        animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .alert {
        display: none;
        background-color: #d4edda;
        color: #155724;
        padding: 10px;
        border-radius: 8px;
        margin-top: 15px;
        border: 1px solid #c3e6cb;
        text-align: center;
        font-size: 0.9em;
    }

    h1 {
        font-size: 1.8em;
        color: #333;
        margin-bottom: 20px;
    }

    .form-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 25px;
    }

    input[type="text"], input[type="number"] {
        padding: 12px;
        width: 100%;
        font-size: 1em;
        border: 2px solid #ddd;
        border-radius: 8px;
        outline: none;
        transition: border 0.3s;
        box-sizing: border-box;
    }

    input[type="text"]:focus, input[type="number"]:focus {
        border-color: #4a90e2;
    }

    .button-container {
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    button {
        padding: 12px;
        font-size: 1em;
        font-weight: bold;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.3s, transform 0.3s;
    }

    .btn-volver {
        background-color: #e74c3c;
    }

    .btn-volver:hover {
        background-color: #c0392b;
        transform: translateY(-3px);
    }

    .btn-add {
        background-color: #28a745;
    }

    .btn-add:hover {
        background-color: #218838;
        transform: translateY(-3px);
    }
</style>
</head>
<body>
    <div class="container">
        <h1>Agregar Productos</h1>
        <div id="alert" class="alert">¡Producto agregado correctamente!</div>
        <div class="form-container">
            <input type="text" id="productName" placeholder="Nombre del producto">
            <input type="number" id="productQuantity" placeholder="Cantidad">
            <input type="text" id="productCode" placeholder="Código del producto">
            <input type="number" id="productPrice" placeholder="Precio">
        </div>
        <div class="button-container">
            <button class="btn-volver" id="backButton">Volver</button>
            <button class="btn-add" id="addButton">Agregar</button>
        </div>
    </div>

    <script>
        const addButton = document.getElementById('addButton');
        const backButton = document.getElementById('backButton');
        const productNameInput = document.getElementById('productName');
        const productQuantityInput = document.getElementById('productQuantity');
        const productCodeInput = document.getElementById('productCode');
        const productPriceInput = document.getElementById('productPrice');
        const alert = document.getElementById('alert');

        // Función para agregar un producto
        addButton.addEventListener('click', () => {
            const name = productNameInput.value.trim();
            const quantity = productQuantityInput.value.trim();
            const code = productCodeInput.value.trim();
            const price = productPriceInput.value.trim();

            if (name === "" || quantity === "" || code === "" || price === "") {
                alert.textContent = "Por favor, completa todos los campos.";
                alert.style.backgroundColor = "#f8d7da";
                alert.style.color = "#721c24";
                alert.style.borderColor = "#f5c6cb";
                alert.style.display = "block";
                return;
            }

            // Mostrar mensaje de éxito
            alert.textContent = "¡Producto agregado correctamente!";
            alert.style.backgroundColor = "#d4edda";
            alert.style.color = "#155724";
            alert.style.borderColor = "#c3e6cb";
            alert.style.display = "block";

            // Ocultar la alerta después de 3 segundos
            setTimeout(() => {
                alert.style.display = "none";
            }, 3000);

            // Limpiar campos
            productNameInput.value = '';
            productQuantityInput.value = '';
            productCodeInput.value = '';
            productPriceInput.value = '';
        });

        backButton.addEventListener('click', () => {
            window.location.href = 'menu.html';
        });
    </script>
</body>
</html>
