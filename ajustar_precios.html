<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajustar Precios - Ferretería</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    /* Estilos generales */
    body {
        font-family: Arial, sans-serif;
        background-image: url('https://images.unsplash.com/photo-1531824475211-72594993ce2a?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        min-height: 100vh;
    }

    .container {
        max-width: 600px;
        width: 100%;
        background-color: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        margin-top: 20px;
        animation: slideIn 0.6s ease;
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        text-align: center;
        color: #007bff;
        margin-bottom: 20px;
        font-size: 24px;
    }

    .search-bar {
        display: flex;
        margin-bottom: 20px;
    }

    .search-bar input[type="text"] {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px 0 0 5px;
        outline: none;
        transition: box-shadow 0.3s ease;
    }

    .search-bar input[type="text"]:focus {
        box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
    }

    .search-bar button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
        border-radius: 0 5px 5px 0;
        transition: background-color 0.3s ease, transform 0.2s;
    }

    .search-bar button:hover {
        background-color: #0056b3;
        transform: scale(1.05);
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .form-group input[type="text"], .form-group input[type="number"] {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px;
        outline: none;
        transition: box-shadow 0.3s ease;
    }

    .form-group input:focus {
        box-shadow: 0 0 8px rgba(40, 167, 69, 0.3);
    }

    .button-container {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }

    .button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s;
    }

    .button-green {
        background-color: #28a745;
        color: #fff;
    }

    .button-green:hover {
        background-color: #218838;
        transform: scale(1.05);
    }

    .button-gray {
        background-color: #e74c3c;
        color: #fff;
    }

    .button-gray:hover {
        background-color: #5a6268;
        transform: scale(1.05);
    }

    .notification {
        padding: 10px;
        border-radius: 5px;
        margin-top: 20px;
        display: none;
        text-align: center;
    }

    .notification.success {
        background-color: #d4edda;
        color: #155724;
    }

    .notification.error {
        background-color: #f8d7da;
        color: #721c24;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Ajustar Precios</h1>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar producto por nombre...">
        <button onclick="searchProduct()">Buscar</button>
    </div>

    <div id="searchNotification" class="notification"></div>

    <form id="priceForm">
        <div class="form-group">
            <label for="currentPrice">Precio actual</label>
            <input type="text" id="currentPrice" disabled>
        </div>

        <div class="form-group">
            <label for="newPrice">Nuevo Precio</label>
            <input type="text" id="newPrice" required>
        </div>

        <div class="button-container">
            <button type="button" class="button button-gray" onclick="window.location.href='menu.html';">Volver</button>
            <button type="button" class="button button-green" onclick="adjustPrice()">Ajustar Precio</button>
        </div>
    </form>

    <div id="adjustNotification" class="notification"></div>
</div>

<script>
    let stockData = [];

    function loadExcelFromFile() {
        fetch('informe.xlsx')
            .then(response => response.arrayBuffer())
            .then(data => {
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                stockData = XLSX.utils.sheet_to_json(sheet);
            })
            .catch(error => console.error("Error al cargar el archivo Excel:", error));
    }

    function searchProduct() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const searchNotification = document.getElementById("searchNotification");
        const product = stockData.find(item => item.Producto.toLowerCase() === input);

        if (product) {
            const formattedPrice = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' }).format(product["Precio Unitario"]);
            document.getElementById("currentPrice").value = formattedPrice;
            document.getElementById("newPrice").value = ""; // Limpiar campo de nuevo precio
            showNotification(searchNotification, "Producto encontrado: " + product.Producto, "success");
        } else {
            showNotification(searchNotification, "Producto no encontrado", "error");
        }
    }

    function adjustPrice() {
        const productName = document.getElementById("searchInput").value.toLowerCase();
        const newPriceInput = document.getElementById("newPrice").value.replace(/\D/g, '');
        const newPrice = parseFloat(newPriceInput);
        const adjustNotification = document.getElementById("adjustNotification");

        const product = stockData.find(item => item.Producto.toLowerCase() === productName);

        if (product && newPrice > 0) {
            product["Precio Unitario"] = newPrice;
            showNotification(adjustNotification, `El precio de ${product.Producto} ha sido ajustado a $${new Intl.NumberFormat('es-CL').format(newPrice)}`, "success");
        } else {
            showNotification(adjustNotification, "Producto no encontrado o precio inválido.", "error");
        }
    }

    function showNotification(element, message, type) {
        element.textContent = message;
        element.className = "notification " + type;
        element.style.display = "block";
        setTimeout(() => element.style.display = "none", 3000);
    }

    document.addEventListener("DOMContentLoaded", loadExcelFromFile);
</script>

</body>
</html>
