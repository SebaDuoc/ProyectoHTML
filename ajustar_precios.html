<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajustar Precios - Ferretería</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
    }

    .container {
        max-width: 600px;
        width: 100%;
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-top: 20px;
    }

    h1 {
        text-align: center;
        color: #007bff;
        margin-bottom: 20px;
    }

    .search-bar {
        display: flex;
        margin-bottom: 20px;
    }

    .search-bar input[type="text"] {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px 0 0 5px;
        outline: none;
    }

    .search-bar button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
        border-radius: 0 5px 5px 0;
    }

    .search-bar button:hover {
        background-color: #0056b3;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .form-group input[type="number"] {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px;
        outline: none;
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        background-color: #28a745;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .submit-btn:hover {
        background-color: #218838;
    }

</style>
</head>
<body>

<div class="container">
    <h1>Ajustar Precios</h1>

    <!-- Barra de búsqueda -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar producto por nombre...">
        <button onclick="searchProduct()">Buscar</button>
    </div>

    <!-- Formulario de ajuste de precio -->
    <form id="priceForm">
        <div class="form-group">
            <label for="productName">Producto seleccionado</label>
            <input type="text" id="productName" disabled placeholder="Nombre del producto" value="">
        </div>

        <div class="form-group">
            <label for="newPrice">Nuevo Precio</label>
            <input type="number" id="newPrice" min="0" step="0.01" placeholder="Ingrese el nuevo precio" required>
        </div>

        <button type="button" class="submit-btn" onclick="adjustPrice()">Ajustar Precio</button>
    </form>
</div>

<script>
    // Función de búsqueda simulada
    function searchProduct() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        
        // Simulación: asume que se encuentra el producto ingresado
        const product = "Martillo"; // Cambia esto según el producto buscado
        if (product.toLowerCase().includes(input)) {
            document.getElementById("productName").value = product;
            alert("Producto encontrado: " + product);
        } else {
            alert("Producto no encontrado");
        }
    }

    // Función de ajuste de precio simulada
    function adjustPrice() {
        const product = document.getElementById("productName").value;
        const newPrice = document.getElementById("newPrice").value;

        if (product && newPrice) {
            alert(`El precio de ${product} ha sido ajustado a $${newPrice}`);
            // Aquí podrías agregar una llamada para enviar los datos al servidor
        } else {
            alert("Por favor, seleccione un producto y establezca un nuevo precio.");
        }
    }
</script>

</body>
</html>
