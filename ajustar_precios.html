<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajustar Precios - Ferretería</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    /* Estilos generales */
    body {
        font-family: Arial, sans-serif;
        background-image: url('https://images.unsplash.com/photo-1531824475211-72594993ce2a?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        min-height: 100vh;
    }

    .container {
        max-width: 600px;
        width: 100%;
        background-color: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        margin-top: 20px;
        animation: slideIn 0.6s ease;
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        text-align: center;
        color: #007bff;
        margin-bottom: 20px;
        font-size: 24px;
    }

    /* Barra de búsqueda */
    .search-bar {
        display: flex;
        margin-bottom: 20px;
    }

    .search-bar input[type="text"] {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px 0 0 5px;
        outline: none;
        transition: box-shadow 0.3s ease;
    }

    .search-bar input[type="text"]:focus {
        box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
    }

    .search-bar button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
        border-radius: 0 5px 5px 0;
        transition: background-color 0.3s ease, transform 0.2s;
    }

    .search-bar button:hover {
        background-color: #0056b3;
        transform: scale(1.05);
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .form-group input[type="number"] {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px;
        outline: none;
        transition: box-shadow 0.3s ease;
    }

    .form-group input[type="number"]:focus {
        box-shadow: 0 0 8px rgba(40, 167, 69, 0.3);
    }

    /* Botón de ajuste de precio */
    .submit-btn {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        background-color: #28a745;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s;
    }

    .submit-btn:hover {
        background-color: #218838;
        transform: scale(1.05);
    }

    /* Estilos de notificación */
    .notification {
        padding: 10px;
        border-radius: 5px;
        margin-top: 20px;
        display: none;
        text-align: center;
    }

    .notification.success {
        background-color: #d4edda;
        color: #155724;
    }

    .notification.error {
        background-color: #f8d7da;
        color: #721c24;
    }

</style>
</head>
<body>

<div class="container">
    <h1>Ajustar Precios</h1>

    <!-- Barra de búsqueda -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar producto por nombre...">
        <button onclick="searchProduct()">Buscar</button>
    </div>

    <!-- Notificación de búsqueda -->
    <div id="searchNotification" class="notification"></div>

    <!-- Formulario de ajuste de precio -->
    <form id="priceForm">
        <div class="form-group">
            <label for="productName">Producto seleccionado</label>
            <input type="text" id="productName" disabled placeholder="Nombre del producto" value="">
        </div>

        <div class="form-group">
            <label for="newPrice">Nuevo Precio</label>
            <input type="number" id="newPrice" min="0" step="0.01" placeholder="Ingrese el nuevo precio" required>
        </div>

        <!-- Botón de ajuste de precio -->
        <button type="button" class="submit-btn" onclick="adjustPrice()">Ajustar Precio</button>
    </form>

    <!-- Notificación de ajuste de precio -->
    <div id="adjustNotification" class="notification"></div>
</div>

<script>
    // Función de búsqueda simulada
    function searchProduct() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const searchNotification = document.getElementById("searchNotification");

        // Simulación: asume que se encuentra el producto ingresado
        const product = "Martillo"; // Cambia esto según el producto buscado
        if (product.toLowerCase().includes(input)) {
            document.getElementById("productName").value = product;
            showNotification(searchNotification, "Producto encontrado: " + product, "success");
        } else {
            showNotification(searchNotification, "Producto no encontrado", "error");
        }
    }

    // Función de ajuste de precio simulada
    function adjustPrice() {
        const product = document.getElementById("productName").value;
        const newPrice = document.getElementById("newPrice").value;
        const adjustNotification = document.getElementById("adjustNotification");

        if (product && newPrice) {
            showNotification(adjustNotification, `El precio de ${product} ha sido ajustado a $${newPrice}`, "success");
            // Aquí podrías agregar una llamada para enviar los datos al servidor
        } else {
            showNotification(adjustNotification, "Por favor, seleccione un producto y establezca un nuevo precio.", "error");
        }
    }

    // Función para mostrar notificaciones
    function showNotification(element, message, type) {
        element.textContent = message;
        element.className = "notification " + type;
        element.style.display = "block";
        
        // Ocultar la notificación después de 3 segundos
        setTimeout(() => {
            element.style.display = "none";
        }, 3000);
    }
</script>

</body>
</html>
